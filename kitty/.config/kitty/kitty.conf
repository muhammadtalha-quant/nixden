font_family JetBrainsMono Nerd Font Mono
font_size 14

background_opacity 0.930000
confirm_os_window_close 0
cursor_trail 1
enable_audio_bell no
enabled_layouts splits,stack
hide_window_decorations yes
notify_on_cmd_finish invisible 5.0
remember_window_size no
scrollback never
scrollback_lines 100000

map ctrl+alt+down no_op
map ctrl+alt+enter no_op
map ctrl+alt+left no_op
map ctrl+alt+right no_op
map ctrl+alt+up no_op
map ctrl+down no_op
map ctrl+left no_op
map ctrl+right no_op
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+down scroll_line_down
map ctrl+shift+enter no_op
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+home no_op
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+q no_op
map ctrl+shift+t no_op
map ctrl+shift+up scroll_line_up
map ctrl+shift+v paste_from_clipboard
map ctrl+up no_op
map page_down scroll_page_down
map page_up scroll_page_up

include themes/noctalia.conf

